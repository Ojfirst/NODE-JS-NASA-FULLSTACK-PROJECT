name: NASA PROJECT CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js version 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install
      - run: npm run build --prefix client
